<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контроль склада</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#14161a;
    --panel:#1e2127;
    --panel-alt:#262a31;
    --border:#33383f;
    --text:#e5e3de;
    --text-dim:#8b9099;
    --accent:#f5a623;
    --accent-dim:#7a5713;
    --danger:#e5484d;
    --danger-dim:#3a1618;
    --success:#3ecf8e;
    --success-dim:#123023;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
  }
  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:20px 0;
    display:flex;
    flex-direction:column;
  }
  .brand-header{padding:0 18px 16px 18px; border-bottom:1px solid var(--border); margin-bottom:8px;}
  .brand-header .eyebrow{font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); font-weight:700;}
  .brand-header h1{font-size:16px; margin:4px 0 0 0; font-weight:700; letter-spacing:-0.01em;}
  .nav-section{list-style:none; margin:0 0 10px 0; padding:0;}
  .brand-list{list-style:none; margin:0; padding:0; flex:1; overflow-y:auto;}
  .nav-label{padding:10px 18px 4px 18px; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); font-weight:700;}
  .brand-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px; cursor:pointer; color:var(--text-dim); font-size:13.5px;
    border-left:3px solid transparent; transition:background .12s;
  }
  .brand-item:hover{background:var(--panel-alt);}
  .brand-item.active{color:var(--text); background:var(--panel-alt); border-left-color:var(--accent); font-weight:600;}
  .brand-count{
    font-family:var(--mono); font-size:10px; color:var(--text-dim);
    background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:1px 7px;
  }
  .brand-count.has-shortage{color:#ff9b9e; border-color:#6b2226; background:var(--danger-dim);}
  .brand-item.active .brand-count{color:var(--accent); border-color:var(--accent-dim);}
  .add-brand{
    margin:10px 18px 0 18px; padding:9px 10px; background:transparent;
    border:1px dashed var(--border); color:var(--text-dim); border-radius:8px;
    font-size:12.5px; cursor:pointer; text-align:center;
  }
  .add-brand:hover{border-color:var(--accent); color:var(--accent);}

  .main{flex:1; padding:28px 36px 60px 36px; max-width:1100px;}
  .main-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .main-header h2{font-size:22px; margin:0; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:10px;}
  .rename-btn{font-size:11px; color:var(--text-dim); background:none; border:1px solid var(--border); padding:3px 9px; border-radius:6px; cursor:pointer;}
  .rename-btn:hover{color:var(--accent); border-color:var(--accent-dim);}
  .updated-at{font-size:12px; color:var(--text-dim); font-family:var(--mono);}

  .tabs{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--border);}
  .tab{padding:9px 16px; font-size:13px; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; font-weight:600;}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent);}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:20px;}
  .panel h3{margin:0 0 4px 0; font-size:14px; font-weight:700;}
  .panel .hint{color:var(--text-dim); font-size:12.5px; margin:0 0 16px 0; line-height:1.5;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:8px 10px; color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border);}
  td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--mono);}

  input[type=text], input[type=number]{background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 9px; border-radius:6px; font-size:13px; width:100%;}
  input:focus{outline:none; border-color:var(--accent);}
  select{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:7px 9px; border-radius:6px; font-size:13px;}

  .btn{background:var(--accent); color:#1a1300; border:none; padding:8px 16px; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.secondary:hover{border-color:var(--accent); color:var(--accent);}
  .btn.small{padding:5px 11px; font-size:12px;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .del-row{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:15px;}
  .del-row:hover{color:var(--danger);}

  .dropzone{border:1.5px dashed var(--border); border-radius:10px; padding:30px 20px; text-align:center; color:var(--text-dim); font-size:13px; cursor:pointer;}
  .dropzone:hover{border-color:var(--accent); color:var(--accent);}
  .dropzone.drag{border-color:var(--accent); background:var(--panel-alt); color:var(--accent);}
  #fileInput{display:none;}

  .col-map{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-top:16px;}
  .col-map label{display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}

  .alert-banner{display:flex; align-items:center; gap:10px; background:var(--danger-dim); border:1px solid #6b2226; color:#ff9b9e; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:13px;}
  .warn-banner{display:flex; align-items:center; gap:10px; background:#3a2f10; border:1px solid #6b5522; color:#ffd48b; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:13px;}
  .ok-banner{display:flex; align-items:center; gap:10px; background:var(--success-dim); border:1px solid #1f5c43; color:#8bf0c4; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:13px;}

  .gauge-wrap{width:120px;}
  .gauge-track{position:relative; height:7px; background:var(--bg); border-radius:4px; overflow:visible; border:1px solid var(--border);}
  .gauge-fill{position:absolute; top:0; left:0; height:100%; border-radius:4px;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--text-dim); font-size:13px;}
  .empty-state .big{font-size:30px; margin-bottom:8px;}

  .tag{font-size:10px; padding:2px 7px; border-radius:5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .tag.low{background:var(--danger-dim); color:#ff9b9e;}
  .tag.ok{background:var(--success-dim); color:#8bf0c4;}

  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-top:4px;}
  .brand-card{background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer;}
  .brand-card:hover{border-color:var(--accent);}
  .brand-card .name{font-weight:700; font-size:14px; margin-bottom:8px;}
  .brand-card .stat{font-size:12px; color:var(--text-dim); font-family:var(--mono);}
  .brand-card .stat.low{color:#ff9b9e; font-weight:700;}

  .assign-form{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px;}
  .assign-form > div{flex:1; min-width:120px;}
  .assign-form label{display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px;}
  .brand-chip-row{display:flex; flex-wrap:wrap; gap:6px; max-width:340px;}
  .brand-chip{
    display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-dim);
    background:var(--panel-alt); border:1px solid var(--border); border-radius:6px;
    padding:4px 8px; cursor:pointer; white-space:nowrap;
  }
  .brand-chip input{width:auto; margin:0;}
  .brand-chip:has(input:checked){color:var(--text); border-color:var(--accent-dim); background:#332608;}

  .search-box{margin-bottom:12px;}
  ::placeholder{color:var(--text-dim);}

  #toast{
    position:fixed; bottom:20px; right:20px; max-width:360px; z-index:9999;
    padding:12px 16px; border-radius:8px; font-size:13px; line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.4); display:none;
  }
  #toast.info{background:var(--panel-alt); border:1px solid var(--border); color:var(--text);}
  #toast.success{background:var(--success-dim); border:1px solid #1f5c43; color:#8bf0c4;}
  #toast.error{background:var(--danger-dim); border:1px solid #6b2226; color:#ff9b9e;}
  #toast.warning{background:#3a2f10; border:1px solid #6b5522; color:#ffd48b;}

  .inline-form{display:flex; gap:8px; align-items:center; margin-top:8px;}
  .inline-form input{max-width:220px;}
  .name-field{margin-top:12px;}
  .name-field label{display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .name-field input{font-size:12px; padding:6px 8px;}
  .detect-note{font-size:12px; color:var(--text-dim); margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .detect-note a{color:var(--accent); cursor:pointer; text-decoration:underline;}
</style>

<body>
<div class="app">
  <div class="sidebar">
    <div class="brand-header">
      <div class="eyebrow">Склад запчастей</div>
      <h1>Панель контроля</h1>
      <div class="name-field">
        <label>Ваше имя</label>
        <input type="text" id="userNameInput" placeholder="Введите имя">
      </div>
    </div>
    <ul class="nav-section">
      <li class="brand-item" id="homeNavItem"><span>🏠 Главная</span></li>
    </ul>
    <div class="nav-label">Бренды</div>
    <ul class="brand-list" id="brandList"></ul>
    <button class="add-brand" id="addBrandBtn">+ Добавить бренд</button>
    <div class="inline-form" id="addBrandForm" style="display:none; margin:8px 18px 0 18px;">
      <input type="text" id="addBrandInput" placeholder="Название бренда">
      <button class="btn small" id="addBrandSave">OK</button>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>
<div id="toast"></div>

<script>
// Talks to our own Express backend (server.js) instead of Claude's window.storage.
// Same get/set/delete/list shape, so the rest of the app didn't need to change.
const storage = {
  async get(key){
    const res = await fetch('/api/kv/' + encodeURIComponent(key));
    if(res.status === 404) throw new Error('not found');
    if(!res.ok) throw new Error('storage error: ' + res.status);
    return res.json();
  },
  async set(key, value){
    const res = await fetch('/api/kv/' + encodeURIComponent(key), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({value})
    });
    if(!res.ok) return null;
    return res.json();
  },
  async delete(key){
    const res = await fetch('/api/kv/' + encodeURIComponent(key), {method: 'DELETE'});
    if(!res.ok) return null;
    return res.json();
  },
  async list(prefix){
    const res = await fetch('/api/kv?prefix=' + encodeURIComponent(prefix || ''));
    if(!res.ok) return null;
    return res.json();
  }
};

const BRANDS_KEY = "brands_list";
const GLOBAL_STOCK_KEY = "stock__GLOBAL_MIXED";
let brands = [];
let activePage = "home"; // "home" or a brand name
let activeBrandTab = "status";
let parsedRows = null;
let parsedHeaders = null;
let currentUserName = "";

function normKey(s){ return String(s===undefined||s===null?"":s).trim().toUpperCase().replace(/\s+/g,""); }
function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showToast(text, type){
  type = type || "info";
  const t = document.getElementById("toast");
  t.className = type;
  t.textContent = text;
  t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = "none"; }, 5000);
}

async function loadBrands(){
  try{
    const res = await storage.get(BRANDS_KEY);
    brands = res ? JSON.parse(res.value) : null;
  }catch(e){ brands = null; }
  if(!brands){
    brands = ["Kia","Hyundai","Chevrolet","Lada (ВАЗ)","Chery","JAC"];
    await storage.set(BRANDS_KEY, JSON.stringify(brands));
  }
}
async function saveBrandsList(){ await storage.set(BRANDS_KEY, JSON.stringify(brands)); }

function threshKey(b){ return "thresh__" + normKey(b); }
async function getThresholds(brand){
  try{ const res = await storage.get(threshKey(brand)); return res ? JSON.parse(res.value) : {}; }
  catch(e){ return {}; }
}
async function saveThresholds(brand, data){ await storage.set(threshKey(brand), JSON.stringify(data)); }

async function getGlobalStock(){
  try{ const res = await storage.get(GLOBAL_STOCK_KEY); return res ? JSON.parse(res.value) : null; }
  catch(e){ return null; }
}
async function saveGlobalStock(data){ await storage.set(GLOBAL_STOCK_KEY, JSON.stringify(data)); }

// Build artikul -> [ {brand, name, minQty}, ... ] map from ALL brands' threshold registries.
// This registry doubles as the brand-classification source of truth.
// An artikul can legitimately belong to more than one brand (a shared/universal part),
// so each artikul maps to a LIST of brand entries, not a single one.
async function buildArtikulMap(){
  const map = {};
  for(const b of brands){
    const th = await getThresholds(b);
    Object.keys(th).forEach(art => {
      const k = normKey(art);
      if(!map[k]) map[k] = [];
      map[k].push({ brand: b, artikul: art, name: th[art].name, minQty: th[art].minQty });
    });
  }
  return map;
}

/* ---------------- SIDEBAR ---------------- */

async function renderSidebar(){
  document.getElementById("homeNavItem").className = "brand-item" + (activePage === "home" ? " active" : "");
  document.getElementById("homeNavItem").onclick = () => { activePage = "home"; renderAll(); };

  const list = document.getElementById("brandList");
  const stock = await getGlobalStock();
  const map = await buildArtikulMap();
  const stockByBrand = {};
  if(stock){
    stock.items.forEach(it => {
      const hits = map[normKey(it.artikul)] || [];
      hits.forEach(hit => {
        (stockByBrand[hit.brand] = stockByBrand[hit.brand] || []).push({...it, minQty:hit.minQty});
      });
    });
  }

  list.innerHTML = "";
  brands.forEach(b => {
    const items = stockByBrand[b] || [];
    const shortages = items.filter(it => it.qty < it.minQty).length;
    const li = document.createElement("li");
    li.className = "brand-item" + (b === activePage ? " active" : "");
    li.innerHTML = `<span>${esc(b)}</span>` + (shortages > 0 ? `<span class="brand-count has-shortage">${shortages}</span>` : "");
    li.onclick = () => { activePage = b; activeBrandTab = "status"; renderAll(); };
    list.appendChild(li);
  });
}

document.getElementById("addBrandBtn").onclick = () => {
  document.getElementById("addBrandForm").style.display = "flex";
  document.getElementById("addBrandBtn").style.display = "none";
  document.getElementById("addBrandInput").focus();
};
document.getElementById("addBrandInput").onkeydown = (e) => { if(e.key === "Enter") document.getElementById("addBrandSave").click(); };
document.getElementById("addBrandSave").onclick = async () => {
  const name = document.getElementById("addBrandInput").value.trim();
  if(!name){ showToast("Введите название бренда.", "warning"); return; }
  if(brands.includes(name)){ showToast("Такой бренд уже существует.", "warning"); activePage = name; renderAll(); return; }
  brands.push(name);
  await saveBrandsList();
  activePage = name;
  document.getElementById("addBrandForm").style.display = "none";
  document.getElementById("addBrandBtn").style.display = "block";
  document.getElementById("addBrandInput").value = "";
  showToast("Бренд «" + name + "» добавлен.", "success");
  renderAll();
};

/* ---------------- HOME PAGE ---------------- */

async function renderHome(){
  const main = document.getElementById("main");
  const stock = await getGlobalStock();

  main.innerHTML = `
    <div class="main-header">
      <h2>Главная</h2>
      <div class="updated-at" id="updatedAt">${stock ? "Последняя загрузка: " + new Date(stock.updatedAt).toLocaleString("ru-RU") + (stock.uploadedBy ? " · " + esc(stock.uploadedBy) : "") : "База ещё не загружена"}</div>
    </div>

    <div class="panel">
      <h3>Загрузка ежедневной базы (все бренды вместе)</h3>
      <p class="hint">Загрузите Excel (.xlsx, .xls) или CSV файл с остатками по всем брендам сразу — вперемешку. Система сама распределит позиции по брендам на основе артикула, используя список минимальных количеств, который вы задали для каждого бренда.</p>
      <div class="dropzone" id="dropzone">
        📂 Перетащите файл сюда или нажмите, чтобы выбрать<br>
        <span style="font-size:11px; opacity:.7;">.xlsx / .xls / .csv</span>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <div id="mapArea"></div>
    </div>

    <div id="homeResults"></div>
  `;

  const dz = document.getElementById("dropzone");
  const fi = document.getElementById("fileInput");
  dz.onclick = () => fi.click();
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("drag"); };
  dz.ondragleave = () => dz.classList.remove("drag");
  dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("drag"); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  fi.onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); };

  if(stock) await renderHomeResults(stock);
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:""});
      const parsed = extractHeaderAndData(rows);
      if(!parsed.headers.some(h => h)){ showToast("Файл выглядит пустым.", "error"); return; }
      parsedHeaders = parsed.headers;
      parsedRows = parsed.dataRows;
      autoDetectAndProcess();
    }catch(err){
      showToast("Не удалось прочитать файл. Проверьте формат (.xlsx/.xls/.csv). " + err.message, "error");
    }
  };
  reader.readAsArrayBuffer(file);
}

// Many accounting exports (1C etc.) use multi-row or merged headers, e.g.
// "Итого" / "Нач. ост." / "Количество (в ед. хранения)" stacked across several lines
// above the real data. This scans the first rows, treats the point where a row starts
// looking numeric (real stock data) as the data start, and flattens everything above
// into one combined header string per column so keyword matching still works.
function extractHeaderAndData(rows){
  const firstNonEmpty = rows.findIndex(r => r.some(c => String(c).trim() !== ""));
  if(firstNonEmpty === -1) return { headers: [], dataRows: [] };

  let dataStart = -1;
  for(let i = firstNonEmpty + 1; i < Math.min(rows.length, firstNonEmpty + 20); i++){
    const row = rows[i];
    const nonEmpty = row.filter(c => String(c).trim() !== "");
    if(nonEmpty.length < 1) continue;
    const numericCount = nonEmpty.filter(c => {
      const s = String(c).trim();
      return /\d/.test(s) && /^[\d\s.,\-]+$/.test(s);
    }).length;
    if(numericCount / nonEmpty.length >= 0.4){ dataStart = i; break; }
  }
  if(dataStart === -1) dataStart = firstNonEmpty + 1;

  const headerRows = rows.slice(firstNonEmpty, dataStart);
  const colCount = Math.max(0, ...rows.map(r => r.length));
  const headers = [];
  for(let c = 0; c < colCount; c++){
    const parts = headerRows.map(r => String(r[c]===undefined?"":r[c]).trim()).filter(Boolean);
    headers.push(parts.join(" "));
  }
  const dataRows = rows.slice(dataStart).filter(r => r.some(c => String(c).trim() !== ""));
  return { headers, dataRows };
}

// Converts values like "8 593,700" (space = thousands separator, comma = decimal separator,
// common in Russian-locale exports) into a proper number.
function parseQty(raw){
  let s = String(raw===undefined||raw===null?"":raw).trim();
  if(s === "") return 0;
  s = s.replace(/\s+/g, "");
  if(s.includes(",") && !s.includes(".")) s = s.replace(",", ".");
  else s = s.replace(/,/g, "");
  s = s.replace(/[^\d.\-]/g, "");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function guessColumn(headers, keywords, excludeIdx){
  excludeIdx = excludeIdx || [];
  for(let i = 0; i < headers.length; i++){
    if(excludeIdx.includes(i)) continue;
    const h = (headers[i] || "").toLowerCase();
    if(keywords.some(k => h.includes(k))) return i;
  }
  return -1;
}

const ARTIKUL_KEYWORDS = ["артикул","по кат","катал","artikul","код","kod","part","art."];
const QTY_KEYWORDS = ["количество","кол-во","остаток","qty","miqdor","ostatka","кол"];
const NAME_KEYWORDS = ["наимен","название","номенклатура","name","nomi","товар","tovar"];

// Detection order matters: Артикул first (most specific phrases like "по кат."/"артикул"),
// then Количество (excluding whatever column was already claimed as Артикул),
// then Наименование (excluding both). This prevents e.g. "Номенклатура.№ по кат." from
// being mistaken for either Количество or a plain Наименование column.
function detectColumns(headers){
  const artIdx = guessColumn(headers, ARTIKUL_KEYWORDS);
  const qtyIdx = guessColumn(headers, QTY_KEYWORDS, [artIdx]);
  const nameIdx = guessColumn(headers, NAME_KEYWORDS, [artIdx, qtyIdx]);
  return { artIdx, qtyIdx, nameIdx };
}

// Try to auto-detect Артикул / Количество / Наименование columns and process immediately.
// Falls back to manual selection only if detection isn't confident enough.
function autoDetectAndProcess(){
  const d = detectColumns(parsedHeaders);

  if(d.artIdx >= 0 && d.qtyIdx >= 0){
    processColumns(d.artIdx, d.qtyIdx, d.nameIdx);
    const mapArea = document.getElementById("mapArea");
    mapArea.innerHTML = `
      <div class="detect-note">
        ✅ Столбцы определены автоматически: <b>Артикул</b> = «${esc(parsedHeaders[d.artIdx])}», <b>Количество</b> = «${esc(parsedHeaders[d.qtyIdx])}»${d.nameIdx>=0 ? `, <b>Наименование</b> = «${esc(parsedHeaders[d.nameIdx])}»` : ""}.
        <a id="fixColumnsLink">Указать столбцы вручную</a>
      </div>`;
    document.getElementById("fixColumnsLink").onclick = renderColumnMap;
    showToast("База обработана.", "success");
  } else {
    showToast("Не удалось точно определить столбцы — выберите их вручную.", "warning");
    renderColumnMap();
  }
}

function renderColumnMap(){
  if(!parsedHeaders || !parsedRows){
    showToast("Данные файла уже обработаны. Загрузите файл заново, чтобы изменить столбцы.", "warning");
    return;
  }
  const mapArea = document.getElementById("mapArea");
  const opts = parsedHeaders.map((h,i) => `<option value="${i}">${esc(h || "(столбец " + (i+1) + ")")}</option>`).join("");
  const d = detectColumns(parsedHeaders);

  mapArea.innerHTML = `
    <div class="col-map">
      <div><label>Столбец «Артикул» *</label><select id="colArtikul">${opts}</select></div>
      <div><label>Столбец «Количество» *</label><select id="colQty">${opts}</select></div>
      <div><label>Столбец «Наименование» (не обязательно)</label><select id="colName"><option value="-1">— не выбрано —</option>${opts}</select></div>
    </div>
    <div class="btn-row"><button class="btn" id="processBtn">Обработать базу</button></div>
  `;
  if(d.artIdx >= 0) document.getElementById("colArtikul").value = d.artIdx;
  if(d.qtyIdx >= 0) document.getElementById("colQty").value = d.qtyIdx;
  if(d.nameIdx >= 0) document.getElementById("colName").value = d.nameIdx;

  document.getElementById("processBtn").onclick = () => {
    const aIdx = parseInt(document.getElementById("colArtikul").value);
    const qIdx = parseInt(document.getElementById("colQty").value);
    const nIdx = parseInt(document.getElementById("colName").value);
    processColumns(aIdx, qIdx, nIdx);
    document.getElementById("mapArea").innerHTML = `<div class="detect-note">✅ Столбцы применены вручную. <a id="fixColumnsLink2">Изменить</a></div>`;
    document.getElementById("fixColumnsLink2").onclick = renderColumnMap;
  };
}


async function processColumns(aIdx, qIdx, nIdx){
  const items = [];
  parsedRows.forEach(r => {
    const artikul = String(r[aIdx]===undefined?"":r[aIdx]).trim();
    if(!artikul) return;
    let qty = parseQty(r[qIdx]);
    const name = nIdx >= 0 ? String(r[nIdx]===undefined?"":r[nIdx]).trim() : "";
    items.push({artikul, name, qty});
  });

  if(items.length === 0){
    showToast("В файле не найдено ни одной строки с артикулом.", "error");
    return;
  }

  const stockData = { updatedAt: Date.now(), items, uploadedBy: currentUserName };
  await saveGlobalStock(stockData);
  parsedRows = null; parsedHeaders = null;
  await renderHomeResults(stockData);
  await renderSidebar();
  const ua = document.getElementById("updatedAt");
  if(ua) ua.textContent = "Последняя загрузка: " + new Date(stockData.updatedAt).toLocaleString("ru-RU") + (stockData.uploadedBy ? " · " + esc(stockData.uploadedBy) : "");
}

async function renderHomeResults(stock){
  const container = document.getElementById("homeResults");
  const map = await buildArtikulMap();

  const brandGroups = {};
  brands.forEach(b => brandGroups[b] = []);
  const unclassified = [];

  stock.items.forEach(it => {
    const hits = map[normKey(it.artikul)] || [];
    if(hits.length > 0){
      hits.forEach(hit => brandGroups[hit.brand].push({...it, minQty: hit.minQty, registeredName: hit.name}));
    } else {
      unclassified.push(it);
    }
  });

  let totalShortages = 0;
  const cardsHtml = brands.map(b => {
    const items = brandGroups[b];
    const shortages = items.filter(it => it.qty < it.minQty).length;
    totalShortages += shortages;
    return `
      <div class="brand-card" data-brand="${esc(b)}">
        <div class="name">${esc(b)}</div>
        <div class="stat">Позиций: ${items.length}</div>
        <div class="stat ${shortages>0?'low':''}">${shortages>0 ? shortages + " ниже минимума" : "Всё в норме"}</div>
      </div>`;
  }).join("");

  let banner = "";
  if(totalShortages > 0){
    banner = `<div class="alert-banner">🔴 Всего <b>${totalShortages}</b> позиций ниже минимального количества — распределены по брендам ниже.</div>`;
  } else {
    banner = `<div class="ok-banner">✅ По всем классифицированным позициям остатки в норме.</div>`;
  }
  if(unclassified.length > 0){
    banner += `<div class="warn-banner">⚠️ <b>${unclassified.length}</b> артикулов ещё не привязаны к бренду. Заполните таблицу «Не определено по бренду» ниже — дальше это будет происходить автоматически.</div>`;
  }

  let unclassifiedHtml = "";
  if(unclassified.length > 0){
    const brandCheckOptions = brands.map(b=>`<label class="brand-chip"><input type="checkbox" class="brand-opt" value="${esc(b)}"> ${esc(b)}</label>`).join("");
    unclassifiedHtml = `
      <div class="panel">
        <h3>Не определено по бренду (${unclassified.length})</h3>
        <p class="hint">
          Эти артикулы ещё не привязаны ни к одному бренду. Для каждого выберите один или несколько брендов (одна деталь может подходить сразу нескольким брендам) и минимальное количество — это войдёт в общую базу, и в следующий раз распределение произойдёт автоматически. Отметьте несколько строк галочкой и используйте «Применить к отмеченным», чтобы быстро назначить те же бренды сразу нескольким позициям.
        </p>
        <input type="text" class="search-box" id="unclSearch" placeholder="Поиск по артикулу или наименованию...">
        <div class="assign-form" style="margin-bottom:12px; align-items:flex-start;">
          <div>
            <label>Бренды для отмеченных строк (можно несколько)</label>
            <div class="brand-chip-row" id="bulkBrandChips">${brandCheckOptions}</div>
          </div>
          <div style="max-width:140px;">
            <label>Минимум для отмеченных строк</label>
            <input type="number" id="bulkMinInput" min="0" placeholder="не менять">
          </div>
          <button class="btn secondary small" id="bulkApplyBtn">Применить к отмеченным</button>
        </div>
        <div style="max-height:460px; overflow-y:auto;">
        <table>
          <thead><tr>
            <th style="width:30px;"><input type="checkbox" id="unclSelectAll"></th>
            <th>Артикул</th><th>Наименование</th><th>Кол-во</th>
            <th style="width:220px;">Бренды (можно несколько)</th><th style="width:100px;">Минимум</th>
          </tr></thead>
          <tbody id="unclBody">
            ${unclassified.map((it,idx) => `
              <tr data-idx="${idx}" data-search="${esc((it.artikul+" "+it.name).toLowerCase())}">
                <td><input type="checkbox" class="row-check" data-idx="${idx}"></td>
                <td class="mono">${esc(it.artikul)}</td>
                <td>${esc(it.name) || "<span style='color:var(--text-dim)'>—</span>"}</td>
                <td class="mono">${it.qty}</td>
                <td>
                  <div class="brand-chip-row row-brand-chips" data-idx="${idx}">
                    ${brands.map(b=>`<label class="brand-chip"><input type="checkbox" class="row-brand-opt" data-idx="${idx}" value="${esc(b)}"> ${esc(b)}</label>`).join("")}
                  </div>
                </td>
                <td><input type="number" class="min-select" data-idx="${idx}" min="0" value="1"></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        </div>
        <div class="btn-row">
          <button class="btn" id="saveAllUnclBtn">Сохранить все размеченные</button>
        </div>
      </div>
    `;
  }

  container.innerHTML = banner + `
    <div class="panel">
      <h3>Бренды</h3>
      <p class="hint">Нажмите на бренд, чтобы посмотреть его остатки и список нехватки.</p>
      <div class="card-grid">${cardsHtml}</div>
    </div>
  ` + unclassifiedHtml;

  container.querySelectorAll(".brand-card").forEach(card => {
    card.onclick = () => { activePage = card.dataset.brand; activeBrandTab = "status"; renderAll(); };
  });

  if(unclassified.length > 0){
    const selectAll = document.getElementById("unclSelectAll");
    selectAll.onchange = () => {
      document.querySelectorAll("#unclBody .row-check").forEach(cb => { cb.checked = selectAll.checked; });
    };

    document.getElementById("bulkApplyBtn").onclick = () => {
      const chosenBrands = Array.from(document.querySelectorAll("#bulkBrandChips .brand-opt:checked")).map(c => c.value);
      const minVal = document.getElementById("bulkMinInput").value;
      const checked = document.querySelectorAll("#unclBody .row-check:checked");
      if(checked.length === 0){ showToast("Сначала отметьте строки галочкой.", "warning"); return; }
      if(chosenBrands.length === 0 && minVal === ""){ showToast("Выберите хотя бы один бренд или укажите минимум.", "warning"); return; }
      checked.forEach(cb => {
        const idx = cb.dataset.idx;
        if(chosenBrands.length > 0){
          document.querySelectorAll(`.row-brand-opt[data-idx="${idx}"]`).forEach(opt => {
            opt.checked = chosenBrands.includes(opt.value);
          });
        }
        if(minVal !== "") document.querySelector(`.min-select[data-idx="${idx}"]`).value = minVal;
      });
      showToast("Применено к " + checked.length + " строкам. Не забудьте нажать «Сохранить все размеченные».", "info");
    };

    document.getElementById("unclSearch").oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll("#unclBody tr").forEach(tr => { tr.style.display = tr.dataset.search.includes(q) ? "" : "none"; });
    };

    document.getElementById("saveAllUnclBtn").onclick = async () => {
      const updates = {}; // brand -> {artikul: {name, minQty}}
      let count = 0;
      document.querySelectorAll("#unclBody tr").forEach(tr => {
        const idx = tr.dataset.idx;
        const chosenBrands = Array.from(tr.querySelectorAll(".row-brand-opt:checked")).map(c => c.value);
        const minQty = parseFloat(tr.querySelector(".min-select").value);
        if(chosenBrands.length === 0) return;
        const item = unclassified[idx];
        chosenBrands.forEach(brand => {
          if(!updates[brand]) updates[brand] = {};
          updates[brand][item.artikul] = { name: item.name || "", minQty: isNaN(minQty) ? 0 : minQty };
        });
        count++;
      });
      if(count === 0){ showToast("Ни одна строка не размечена брендом.", "warning"); return; }
      for(const brand of Object.keys(updates)){
        const th = await getThresholds(brand);
        Object.assign(th, updates[brand]);
        await saveThresholds(brand, th);
      }
      showToast(count + " артикулов распределено по брендам.", "success");
      renderAll();
    };
  }
}

  const main = document.getElementById("main");
  const stock = await getGlobalStock();

  main.innerHTML = `
    <div class="main-header">
      <h2 id="brandTitleWrap">${esc(brand)} <button class="rename-btn" id="renameBtn">переименовать</button></h2>
      <div class="updated-at">${stock ? "Последняя загрузка: " + new Date(stock.updatedAt).toLocaleString("ru-RU") + (stock.uploadedBy ? " · " + esc(stock.uploadedBy) : "") : "База ещё не загружена"}</div>
    </div>
    <div class="tabs">
      <div class="tab ${activeBrandTab==='status'?'active':''}" data-tab="status">Статус склада</div>
      <div class="tab ${activeBrandTab==='thresholds'?'active':''}" data-tab="thresholds">Минимальные количества</div>
    </div>
    <div id="brandTabContent"></div>
  `;

  document.getElementById("renameBtn").onclick = () => {
    const wrap = document.getElementById("brandTitleWrap");
    wrap.innerHTML = `<input type="text" id="renameInput" value="${esc(brand)}" style="max-width:260px; font-size:18px; font-weight:700;">
      <button class="btn small" id="renameSave">Сохранить</button>
      <button class="btn secondary small" id="renameCancel">Отмена</button>`;
    document.getElementById("renameInput").focus();
    document.getElementById("renameCancel").onclick = () => renderAll();
    document.getElementById("renameSave").onclick = () => saveRename(brand, document.getElementById("renameInput").value.trim());
    document.getElementById("renameInput").onkeydown = (e) => { if(e.key === "Enter") saveRename(brand, document.getElementById("renameInput").value.trim()); };
  };
  main.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => { activeBrandTab = t.dataset.tab; renderAll(); };
  });

  if(activeBrandTab === "status") await renderBrandStatus(brand, stock);
  else await renderBrandThresholds(brand);
}

async function saveRename(oldName, newName){
  if(!newName || newName === oldName){ renderAll(); return; }
  if(brands.includes(newName)){ showToast("Бренд с таким названием уже существует.", "warning"); return; }
  const idx = brands.indexOf(oldName);
  const th = await getThresholds(oldName);
  await saveThresholds(newName, th);
  brands[idx] = newName;
  await saveBrandsList();
  activePage = newName;
  showToast("Бренд переименован.", "success");
  renderAll();
}

async function renderBrandStatus(brand, stock){
  const el = document.getElementById("brandTabContent");
  const thresholds = await getThresholds(brand);
  const thKeys = Object.keys(thresholds);

  if(!stock){
    el.innerHTML = `<div class="panel"><div class="empty-state"><div class="big">📦</div>База ещё не загружена.<br>Перейдите на «Главная», чтобы загрузить ежедневный файл остатков.</div></div>`;
    return;
  }

  const stockMap = {};
  stock.items.forEach(it => { stockMap[normKey(it.artikul)] = it; });

  const items = thKeys.map(artikul => {
    const t = thresholds[artikul];
    const stockItem = stockMap[normKey(artikul)];
    return {
      artikul, name: t.name || (stockItem ? stockItem.name : ""),
      minQty: t.minQty, currentQty: stockItem ? stockItem.qty : 0,
      found: !!stockItem
    };
  });

  const shortages = items.filter(it => it.currentQty < it.minQty)
    .sort((a,b) => (a.currentQty - a.minQty) - (b.currentQty - b.minQty));

  let banner = "";
  if(thKeys.length === 0){
    banner = `<div class="warn-banner">⚠️ Для бренда «${esc(brand)}» ещё не заданы минимальные количества. Перейдите во вкладку «Минимальные количества».</div>`;
  } else if(shortages.length > 0){
    banner = `<div class="alert-banner">🔴 <b>${shortages.length}</b> позиций ниже минимального количества.</div>`;
  } else {
    banner = `<div class="ok-banner">✅ Все отслеживаемые позиции в норме.</div>`;
  }

  let shortageTable = "";
  if(shortages.length > 0){
    shortageTable = `
      <div class="panel">
        <h3>Внимание! Заканчивающиеся запчасти</h3>
        <table>
          <thead><tr><th>Артикул</th><th>Наименование</th><th>Есть</th><th>Минимум</th><th>Уровень</th><th>Статус</th></tr></thead>
          <tbody>
            ${shortages.map(s => {
              const pct = s.minQty > 0 ? Math.round(Math.min(s.currentQty/s.minQty,1)*100) : 0;
              return `<tr>
                <td class="mono">${esc(s.artikul)}</td>
                <td>${esc(s.name) || "<span style='color:var(--text-dim)'>—</span>"}</td>
                <td class="mono">${s.currentQty}</td>
                <td class="mono">${s.minQty}</td>
                <td><div class="gauge-wrap"><div class="gauge-track"><div class="gauge-fill" style="width:${pct}%; background:${pct<34?'var(--danger)':'var(--accent)'};"></div></div></div></td>
                <td><span class="tag low">Мало</span></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  el.innerHTML = banner + shortageTable + `
    <div class="panel">
      <h3>Полный список отслеживаемых позиций</h3>
      <p class="hint">Всего под контролем: ${items.length}</p>
      <input type="text" class="search-box" id="searchBox" placeholder="Поиск по артикулу или наименованию...">
      <div style="max-height:420px; overflow-y:auto;">
      <table>
        <thead><tr><th>Артикул</th><th>Наименование</th><th>Кол-во</th><th>Минимум</th><th>Статус</th></tr></thead>
        <tbody id="fullBody">
          ${items.map(it => `<tr data-search="${esc((it.artikul+" "+it.name).toLowerCase())}">
            <td class="mono">${esc(it.artikul)}</td>
            <td>${esc(it.name) || "<span style='color:var(--text-dim)'>—</span>"}</td>
            <td class="mono">${it.currentQty}</td>
            <td class="mono">${it.minQty}</td>
            <td>${it.currentQty < it.minQty ? '<span class="tag low">Мало</span>' : '<span class="tag ok">Норма</span>'}</td>
          </tr>`).join("")}
          ${items.length===0 ? `<tr><td colspan="5" class="empty-state">Список минимальных количеств пуст.</td></tr>` : ""}
        </tbody>
      </table>
      </div>
    </div>
  `;

  const sb = document.getElementById("searchBox");
  if(sb) sb.oninput = (e) => {
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll("#fullBody tr").forEach(tr => { if(tr.dataset.search) tr.style.display = tr.dataset.search.includes(q) ? "" : "none"; });
  };
}

async function renderBrandThresholds(brand){
  const el = document.getElementById("brandTabContent");
  const th = await getThresholds(brand);
  const entries = Object.entries(th);

  const rowsHtml = entries.map(([artikul, v]) => `
    <tr data-artikul="${esc(artikul)}">
      <td class="mono">${esc(artikul)}</td>
      <td><input type="text" class="name-input" value="${esc(v.name || "")}" placeholder="наименование (не обязательно)"></td>
      <td style="width:110px;"><input type="number" class="min-input" min="0" value="${v.minQty}"></td>
      <td style="width:36px;"><button class="del-row" title="Удалить">✕</button></td>
    </tr>
  `).join("");

  el.innerHTML = `
    <div class="panel">
      <h3>Минимальные количества — ${esc(brand)}</h3>
      <p class="hint">Задайте минимальное количество для каждого артикула один раз. Этот список также используется для автоматического определения бренда при загрузке общей базы.</p>
      <div class="btn-row" style="margin-bottom:14px; margin-top:0;">
        <button class="btn secondary" id="addThreshRow">+ Добавить строку</button>
        <button class="btn" id="saveThresh">Сохранить</button>
      </div>
      <table>
        <thead><tr><th>Артикул</th><th>Наименование</th><th>Минимум</th><th></th></tr></thead>
        <tbody id="threshBody">${rowsHtml}</tbody>
      </table>
      ${entries.length===0 ? `<div class="empty-state"><div class="big">🔧</div>Минимальные количества ещё не заданы.<br>Нажмите «Добавить строку» или сначала загрузите базу и привяжите позиции с «Главная».</div>` : ""}
    </div>
  `;

  document.getElementById("addThreshRow").onclick = () => {
    const body = document.getElementById("threshBody");
    const tr = document.createElement("tr");
    tr.dataset.artikul = "";
    tr.innerHTML = `
      <td><input type="text" class="artikul-input mono" placeholder="номер артикула"></td>
      <td><input type="text" class="name-input" placeholder="наименование (не обязательно)"></td>
      <td style="width:110px;"><input type="number" class="min-input" min="0" value="1"></td>
      <td style="width:36px;"><button class="del-row" title="Удалить">✕</button></td>
    `;
    body.appendChild(tr);
    attachDel();
  };

  document.getElementById("saveThresh").onclick = async () => {
    const body = document.getElementById("threshBody");
    const newTh = {};
    let hasError = false;
    body.querySelectorAll("tr").forEach(tr => {
      const artikulInput = tr.querySelector(".artikul-input");
      const artikul = artikulInput ? artikulInput.value.trim() : tr.dataset.artikul;
      const name = tr.querySelector(".name-input").value.trim();
      const minQty = parseFloat(tr.querySelector(".min-input").value);
      if(!artikul){ hasError = true; return; }
      newTh[artikul] = { name, minQty: isNaN(minQty)?0:minQty };
    });
    if(hasError){ showToast("В каждой строке должен быть указан артикул.", "error"); return; }
    await saveThresholds(brand, newTh);
    showToast("Сохранено ✓", "success");
    renderAll();
  };

  attachDel();
  function attachDel(){
    document.querySelectorAll("#threshBody .del-row").forEach(btn => { btn.onclick = () => btn.closest("tr").remove(); });
  }
}

/* ---------------- MAIN ---------------- */

async function renderAll(){
  await renderSidebar();
  if(activePage === "home") await renderHome();
  else await renderBrandPage(activePage);
}

(async function init(){
  document.getElementById("userNameInput").oninput = (e) => { currentUserName = e.target.value.trim(); };
  await checkStorageAvailability();
  await loadBrands();
  await renderAll();
})();

// If the backend server isn't reachable (server down, or opened the static file
// directly without running the server), all data silently looks empty with no error.
// Detect that explicitly and tell the person what's wrong instead of failing quietly.
async function checkStorageAvailability(){
  let ok = false;
  try{
    const testKey = "__connectivity_check__";
    await storage.set(testKey, "1");
    const res = await storage.get(testKey);
    ok = !!(res && res.value === "1");
  }catch(e){ ok = false; }

  if(!ok){
    const warn = document.createElement("div");
    warn.style.cssText = "position:fixed; top:0; left:0; right:0; z-index:10000; background:#3a1618; border-bottom:1px solid #6b2226; color:#ff9b9e; padding:12px 20px; font-size:13px; text-align:center;";
    warn.innerHTML = "⚠️ <b>Сервер недоступен.</b> Данные не сохраняются. Проверьте, что сервер запущен и сайт открыт по правильному адресу.";
    document.body.prepend(warn);
    document.querySelector(".app").style.marginTop = "54px";
  }
}
</script>
</body>
</html>
