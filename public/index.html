<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

<!-- Installable app (PWA). iOS reads the apple-* tags; the manifest covers the rest. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0D0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Склад">
<link rel="apple-touch-icon" href="/icons/180.png">
<title>Контроль склада</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/192.png">
<!-- Served from this site, not a CDN: an outside script host can be blocked by a
     network or stop serving a version, and when it does the Excel buttons fail
     silently. Local copies also keep the app working offline as an installed PWA. -->
<script defer src="/vendor/xlsx.full.min.js?v=__V__"></script>
<script defer src="/vendor/chart.umd.js?v=__V__"></script>
<link rel="stylesheet" href="/app.css?v=__V__">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-logo"><img src="/icons/192.png" alt="logo"></div>
    <div class="login-field">
      <input type="text" id="loginUser" autocomplete="username" placeholder="Логин">
    </div>
    <div class="login-field">
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="Пароль">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn">Войти</button>
    <div class="login-foot">Склад запчастей · Панель контроля</div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <div class="mobile-bar" id="mobileBar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Меню">☰</button>
    <span class="mobile-title">Склад запчастей</span>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="sidebar">
    <div class="brand-header">
      <div class="eyebrow">Склад запчастей</div>
      <h1>Панель контроля</h1>
      <div class="name-field">
        <label>Ваше имя</label>
        <input type="text" id="userNameInput" placeholder="Введите имя">
      </div>
      <div class="theme-toggle" id="themeToggle">
        <button data-theme-value="light" id="themeLightBtn">☀ Светлая</button>
        <button data-theme-value="dark" id="themeDarkBtn">🌙 Тёмная</button>
      </div>
    </div>
    <ul class="nav-section">
      <li class="brand-item" id="homeNavItem"><span>🏠 Главная</span></li>
      <li class="brand-item" id="warrantyNavItem"><span>🛡 Гарантия</span></li>
    </ul>
    <div class="nav-label">Бренды</div>
    <ul class="brand-list" id="brandList"></ul>
    <button class="add-brand" id="addBrandBtn">+ Добавить бренд</button>
    <div class="inline-form" id="addBrandForm" style="display:none; margin:8px 8px 0 8px;">
      <input type="text" id="addBrandInput" placeholder="Название бренда">
      <button class="btn small" id="addBrandSave">OK</button>
    </div>
    <button class="logout-btn" id="logoutBtn" style="display:none;">Выйти</button>
  </div>

  <div class="main" id="main"></div>
</div>
<div id="toast"></div>

<div id="installHint" class="install-hint">
  <button class="install-hint-close" id="installHintClose" aria-label="Закрыть">&times;</button>
  <div class="install-hint-title">Установить как приложение</div>
  <div class="install-hint-body" id="installHintBody"></div>
</div>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirmTitle"></h3>
    <div id="confirmText"></div>
    <div class="confirm-actions">
      <button class="btn" id="confirmYes">Да</button>
      <button class="btn secondary" id="confirmNo">Нет</button>
    </div>
  </div>
</div>

<script src="/app.js?v=__V__" defer></script>
</body>
</html>
